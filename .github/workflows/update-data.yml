name: Update ACLED Data

# The daily ACLED fetch runs ON THE VPS (scripts/vps-update-data.sh, root cron
# at 00:30 UTC / 07:00 Yangon) because ACLED's Imunify360 bot-protection
# intermittently blocks GitHub's shared runner IPs. The VPS pushes the data
# commit to main; the schedule below only MONITORS that this actually keeps
# happening — it runs an hour after the VPS cron and fails (→ email) only when
# the sync is genuinely broken, never because of one unlucky runner IP.
#
# The GitHub-side fetch is kept as a manual fallback: run the workflow with
# mode=fetch (the default for manual runs) if the VPS is down. It uses the
# two-attempt fresh-IP pattern because of the Imunify360 blocks.
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "fetch = run the ACLED fetch from GitHub (fallback) · monitor = just check freshness"
        type: choice
        options: [fetch, monitor]
        default: fetch

concurrency:
  group: update-acled-data
  cancel-in-progress: false

jobs:
  # ── Scheduled path: verify the VPS-side update is alive and data is fresh ──
  monitor:
    if: github.event_name == 'schedule' || inputs.mode == 'monitor'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Verify VPS sync ran recently and data is fresh
        run: |
          python3 - <<'EOF'
          import json, sys
          from datetime import date, datetime, timezone
          state = json.load(open("data/processed/acled_sync_state.json"))

          last_sync = datetime.fromisoformat(state["last_sync_utc"])
          sync_age_h = (datetime.now(timezone.utc) - last_sync).total_seconds() / 3600
          print(f"Last successful sync: {state['last_sync_utc']} ({sync_age_h:.1f} h ago)")
          if sync_age_h > 48:
              sys.exit(f"SYNC STALLED: no successful sync for {sync_age_h:.0f} h (threshold 48). "
                       f"Check the VPS cron: /var/log/dashboard-data-update.log on the server, "
                       f"or run this workflow manually with mode=fetch as a stopgap.")

          latest = date.fromisoformat(state["latest_event_date"])
          age = (date.today() - latest).days
          print(f"Latest event date: {latest} ({age} days old)")
          if age > 21:
              sys.exit(f"STALE DATA: latest event is {age} days old (threshold 21). "
                       f"Syncs are running but returning nothing new — investigate ACLED access.")
          EOF

  # ── Manual fallback: fetch from GitHub runners (two attempts, fresh IPs) ──
  update:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'fetch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      pipeline_outcome: ${{ steps.pipeline.outcome }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # continue-on-error so one blocked IP doesn't redden the run; the
      # retry-update job below gets a fresh VM (fresh IP) instead.
      - name: Run pipeline update
        id: pipeline
        continue-on-error: true
        env:
          ACLED_EMAIL: ${{ secrets.ACLED_EMAIL }}
          ACLED_PASSWORD: ${{ secrets.ACLED_PASSWORD }}
        run: python pipeline/pipeline.py --update-only

      - name: Commit and push updated data
        if: steps.pipeline.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/
          git diff --cached --quiet || git commit -m "data: auto-update ACLED data $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push

  retry-update:
    needs: update
    if: needs.update.outputs.pipeline_outcome == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline update (second attempt, fresh IP)
        env:
          ACLED_EMAIL: ${{ secrets.ACLED_EMAIL }}
          ACLED_PASSWORD: ${{ secrets.ACLED_PASSWORD }}
        run: python pipeline/pipeline.py --update-only

      - name: Commit and push updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/
          git diff --cached --quiet || git commit -m "data: auto-update ACLED data $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
