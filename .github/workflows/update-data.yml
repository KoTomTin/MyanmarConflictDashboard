name: Update ACLED Data

# Run daily at 00:30 UTC (07:00 Yangon time). ACLED publishes weekly, so most
# runs will find no new events and simply refresh last_checked.json — that is
# intentional, so the dashboard's "Last checked" timestamp advances every day
# while "Events up to" only moves forward when ACLED actually publishes.
# The pipeline is idempotent and records the latest successful check even when
# the data coverage date itself does not move forward on that run.
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

concurrency:
  group: update-acled-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline update
        env:
          ACLED_EMAIL: ${{ secrets.ACLED_EMAIL }}
          ACLED_PASSWORD: ${{ secrets.ACLED_PASSWORD }}
        run: python pipeline/pipeline.py --update-only

      # Tripwire for silent staleness: a sync can "succeed" while returning no
      # rows (this happened in Apr 2026 with the timestamp= filter, and again
      # May–Jul 2026 when the schedule was disabled). ACLED publishes weekly,
      # so 21 days with no new event dates means something upstream is broken
      # and a human needs to look — fail the run so GitHub sends a notification.
      - name: Verify data freshness
        run: |
          python - <<'EOF'
          import json, sys
          from datetime import date
          state = json.load(open("data/processed/acled_sync_state.json"))
          latest = date.fromisoformat(state["latest_event_date"])
          age = (date.today() - latest).days
          print(f"Latest event date: {latest} ({age} days old)")
          if age > 21:
              sys.exit(f"STALE DATA: latest event is {age} days old (threshold: 21). "
                       f"The ACLED fetch is returning no new events — investigate.")
          EOF

      - name: Commit and push updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/
          git diff --cached --quiet || git commit -m "data: auto-update ACLED data $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push

      # Some hosts do not reliably redeploy on bot-pushed data commits.
      # If DEPLOY_HOOK_URL is configured as a repository secret (for example a
      # Render deploy hook), explicitly trigger a redeploy after the fresh data
      # has been pushed to main.
      - name: Trigger deployment hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          HOOK_URL="${RENDER_DEPLOY_HOOK_URL:-$DEPLOY_HOOK_URL}"
          if [ -z "$HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL / DEPLOY_HOOK_URL not set; skipping explicit redeploy trigger."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 "$HOOK_URL"
          echo "Triggered deployment hook."

      # Hetzner / self-managed deployment path.
      # Recommended: store a fixed server-side redeploy command in
      # HETZNER_DEPLOY_COMMAND and invoke it over SSH. This is safer than
      # downloading and running a remote script inline on every deploy.
      - name: Trigger Hetzner redeploy over SSH
        env:
          HETZNER_DEPLOY_HOST: ${{ secrets.HETZNER_DEPLOY_HOST }}
          HETZNER_DEPLOY_USER: ${{ secrets.HETZNER_DEPLOY_USER }}
          HETZNER_DEPLOY_KEY: ${{ secrets.HETZNER_DEPLOY_KEY }}
          HETZNER_DEPLOY_PORT: ${{ secrets.HETZNER_DEPLOY_PORT }}
          HETZNER_DEPLOY_COMMAND: ${{ secrets.HETZNER_DEPLOY_COMMAND }}
        run: |
          if [ -z "$HETZNER_DEPLOY_HOST" ] || [ -z "$HETZNER_DEPLOY_USER" ] || [ -z "$HETZNER_DEPLOY_KEY" ] || [ -z "$HETZNER_DEPLOY_COMMAND" ]; then
            echo "Hetzner SSH redeploy secrets not fully configured; skipping SSH redeploy."
            exit 0
          fi

          PORT="${HETZNER_DEPLOY_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HETZNER_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$PORT" "$HETZNER_DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$PORT" \
            "$HETZNER_DEPLOY_USER@$HETZNER_DEPLOY_HOST" \
            "$HETZNER_DEPLOY_COMMAND"

          echo "Triggered Hetzner redeploy over SSH."
